name: Daily Budget Monitor

on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 ART
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set DATABASE_URL
        run: |
          SECRET="${{ secrets.DATABASE_URL }}"
          if [ -z "$SECRET" ]; then
            echo "DATABASE_URL=sqlite:///sql_app.db" >> $GITHUB_ENV
            echo "Usando SQLite por defecto."
          else
            echo "DATABASE_URL=$SECRET" >> $GITHUB_ENV
            echo "Usando DATABASE_URL desde secret."
          fi

      # Sólo carga 2023 si la tabla no tiene ese año. Antes miraba si existía
      # el archivo sql_app.db, que en el runner nunca existe: con el secret
      # configurado habría insertado 2023 completo otra vez cada día.
      - name: Seed base 2023 sólo si falta
        run: |
          python -c "
          from sqlalchemy import text
          from app.database.session import engine
          from app.database import models
          models.Base.metadata.create_all(bind=engine)
          with engine.connect() as c:
              n = c.execute(text('SELECT COUNT(1) FROM presupuesto_base WHERE ejercicio=2023')).scalar()
          print(f'Filas 2023 en DB: {n}')
          raise SystemExit(0 if n > 0 else 1)
          " && echo "2023 ya está cargado." || python -m scripts.seed_2023

      # Reemplaza 2026 con el dataset del día (antes sólo se cargaba "si no
      # existía", así que quedaba congelado). Sin el secret DATABASE_URL
      # (URL pública de la Postgres de Railway) esto escribiría en un SQLite
      # descartable del runner: en ese caso se avisa y no se hace nada.
      - name: Actualizar presupuesto 2026 en la base de producción
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::warning::Falta el secret DATABASE_URL: no se actualiza la base de producción."
            exit 0
          fi
          python -m scripts.actualizar_presupuesto --anio 2026

      - name: Commit DB actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sql_app.db data/ || true
          git diff --staged --quiet || git commit -m "chore: sync presupuesto $(date +'%Y-%m-%d')"
          git push || true